<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Корзина замовлень</title>
    <link rel="stylesheet" href="style.css" />
    <script src="cart.js" defer></script>
</head>
<body>

    <main class="cart-page">
        <h2>Ви обрали:</h2>

        <table class="cart-table" id="cartTable">
            <thead>
                <tr>
                    <th>№</th>
                    <th>Назва товару</th>
                    <th>Ціна за од.</th>
                    <th>К-сть:</th>
                    <th>Сума:</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cartTableBody"></tbody>
            <tfoot>
                <tr>
                    <td colspan="2"></td>
                    <td colspan="2" class="total-label">Разом до оплати:</td>
                    <td colspan="2" class="total-value" id="cartTotalValue">0.00 грн.</td>
                </tr>
            </tfoot>
        </table>

        <div class="cart-links">
            <a href="#" id="payLink" class="action-link pay-link">Оплатити</a>
            <a href="index.html" class="action-link back-link">Повернутись до покупок</a>
        </div>

        <p id="payMessage" class="pay-message" hidden></p>
    </main>

</body>
</html>
