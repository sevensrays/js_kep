<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна робота №2</title>
</head>
<body>
  <h1>Лабораторна робота №2</h1>

  <script>
    // === Завдання 1 ===
    let userName = "Фархад";

    if (true) {
      let userName = prompt("Завдання 1: Введіть нове ім'я для блоку if:");
      console.log("Всередині блоку if:", userName);
    }

    console.log("Поза блоком if:", userName);


    // === Завдання 2 ===
    let name = prompt("Завдання 2: Введіть ваше ім'я:");
    let age = prompt("Завдання 2: Введіть ваш вік:");

    let isConfirmed = confirm(`Hello, ${name}! Your age is ${age}. Continue?`);
    if (isConfirmed) {
      alert("Welcome!");
    } else {
      alert("Goodbye!");
    }


    // === Завдання 3 ===
    let number = Number(prompt("Завдання 3: Введіть число:"));
    if (number % 2 === 0) {
      alert("Number is even");
    } else {
      alert("Number is odd");
    }
  </script>
</body>
</html>
