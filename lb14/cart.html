<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Корзина замовлень</title>
    <link rel="stylesheet" href="style.css" />
    <script src="cart.js" defer></script>
</head>
<body>

    <main class="cart-page">
        <div class="cart-top-bar">
            <h2 id="cartHeading">Ви обрали:</h2>
            <div class="lang-switch-box">
                <label for="language-selector">🌐</label>
                <select id="language-selector">
                    <option value="uk">Українська</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <table class="cart-table" id="cartTable">
            <thead>
                <tr>
                    <th id="thNum">№</th>
                    <th id="thName">Назва товару</th>
                    <th id="thPrice">Ціна за од.</th>
                    <th id="thQty">К-сть:</th>
                    <th id="thSum">Сума:</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cartTableBody"></tbody>
            <tfoot>
                <tr>
                    <td colspan="2"></td>
                    <td colspan="2" class="total-label" id="totalLabel">Разом до оплати:</td>
                    <td colspan="2" class="total-value" id="cartTotalValue">0.00 грн.</td>
                </tr>
            </tfoot>
        </table>

        <div class="cart-links">
            <a href="#" id="payLink" class="action-link pay-link">Оплатити</a>
            <a href="index.html" id="backToShopLink" class="action-link back-link">Повернутись до покупок</a>
        </div>

        <p id="payMessage" class="pay-message" hidden></p>
    </main>

</body>
</html>
