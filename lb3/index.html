<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lab3</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>

    <section>
        <h2>Завдання 1. Таймер привітання (колбек та стрілкова функція)</h2>
        <div class="controls">
            <button id="startTimerBtn">Запустити таймер (3 сек)</button>
        </div>
        <div id="timerOut" class="message">Очікування запуску...</div>
    </section>

    <section>
        <h2>Завдання 2. Калькулятор (параметри, return, блочний scope)</h2>
        <div class="controls">
            <button id="calcBtn">Запустити калькулятор (prompt)</button>
        </div>
        <div id="calcOut" class="message">Натисніть кнопку для введення чисел.</div>
    </section>

    <section>
        <h2>Завдання 3. Лічильник кліків (замикання / closure)</h2>
        <div class="controls">
            <button id="counterBtn">Збільшити лічильник</button>
        </div>
        <div id="counterOut" class="message">Поточне значення: дивись у консолі та тут.</div>
    </section>

</body>
</html>
