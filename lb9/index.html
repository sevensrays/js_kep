<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна робота — Promise API</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>

    <section>
        <h2>Лабораторна робота: Використання JavaScript Promise API (7–9 балів)</h2>

        <div class="task-block">
            <h3>Завдання 2. Перевірка числа checkNumber(num)</h3>
            <div class="controls">
                <input type="number" id="numInput" placeholder="Введіть число" value="15" />
                <button type="button" id="checkInputBtn">Перевірити введене число</button>
                <button type="button" id="check15Btn">Тест: checkNumber(15)</button>
                <button type="button" id="check5Btn">Тест: checkNumber(5)</button>
            </div>
        </div>

        <div class="task-block">
            <h3>Завдання 3. Випадкове число randomNumber() (1–3 с)</h3>
            <div class="controls">
                <button type="button" id="randomBtn">Згенерувати випадкове число</button>
            </div>
        </div>

        <!-- Завдання 0: Лоадер та блок результату -->
        <div id="loader" style="display: none;">Завантаження...</div>
        <div id="result"></div>
    </section>

</body>
</html>
